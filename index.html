<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Ngọc Rồng TDStudio - Cộng Đồng Game Thủ</title>
    <meta name="description"
      content="Trang chủ chính thức Ngọc Rồng TDStudio - Tham gia cộng đồng game thủ trên Zalo theo từng server.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
      rel="stylesheet">
    <style>
  :root{
    --bg-1:#1a0a05;
    --bg-2:#3a1206;
    --orange-1:#ff7a1a;
    --orange-2:#ff4d00;
    --gold:#ffcc4d;
    --zalo:#0068ff;
    --text-light:#fff3e6;
    --text-dim:#e8c9a8;
    --card-bg:rgba(255,255,255,0.06);
    --card-border:rgba(255,190,120,0.25);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html{scroll-behavior:smooth;}

  body{
    font-family:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color:var(--text-light);
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, #ffae5a22, transparent 60%),
      radial-gradient(ellipse 90% 50% at 50% 100%, #ff4d0033, transparent 60%),
      linear-gradient(180deg, var(--bg-1) 0%, #150703 60%, #0d0402 100%);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- Floating energy particles (pure CSS) ---------- */
  .particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .particles span{
    position:absolute;
    bottom:-10%;
    display:block;
    width:6px; height:6px;
    border-radius:50%;
    background:radial-gradient(circle, var(--gold), var(--orange-2) 70%, transparent 100%);
    opacity:0.7;
    animation:rise linear infinite;
    box-shadow:0 0 8px 2px #ff9a3a99;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:0.8;}
    100%{ transform:translateY(-110vh) translateX(20px); opacity:0;}
  }

  /* ---------- In-app browser warning banner ---------- */
  #social-banner{
    display:none;
    position:sticky;
    top:0;
    z-index:100;
    background:linear-gradient(90deg, #ff4d00, #ff8a00);
    color:#fff;
    padding:10px 14px;
    box-shadow:0 2px 12px rgba(0,0,0,0.35);
  }
  #social-banner.show{display:block;}
  .banner-inner{
    max-width:720px;
    margin:0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    text-align:center;
  }
  .banner-inner p{
    font-size:13.5px;
    line-height:1.4;
    font-weight:500;
    flex:1 1 240px;
  }
  .banner-inner strong{font-weight:700;}
  #copy-link-btn{
    flex:0 0 auto;
    background:#fff;
    color:#c73e00;
    border:none;
    padding:8px 16px;
    border-radius:999px;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .15s ease;
  }
  #copy-link-btn:active{transform:scale(0.95);}
  #copy-link-btn:hover{transform:translateY(-1px);}

  /* ---------- Layout ---------- */
  main{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    padding:36px 20px 50px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* ---------- Logo + glow ---------- */
  .logo-wrap{
    position:relative;
    width:150px;
    height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:18px;
  }
  .logo-glow{
    position:absolute;
    inset:-40px;
    background:radial-gradient(circle, #ff9a3aaa 0%, #ff4d0055 40%, transparent 70%);
    filter:blur(6px);
    animation:pulse 3.2s ease-in-out infinite;
    border-radius:50%;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:0.85;}
    50%{ transform:scale(1.12); opacity:1;}
  }
  .logo-orb{
    position:relative;
    width:120px;
    height:120px;
    z-index:2;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #ffd27f;
    filter:drop-shadow(0 6px 18px rgba(255,80,0,0.55));
  }

  /* ---------- Title ---------- */
  .game-name{
    font-family:'Baloo 2', 'Be Vietnam Pro', sans-serif;
    font-weight:800;
    font-size:clamp(28px, 8vw, 40px);
    line-height:1.15;
    background:linear-gradient(180deg, #ffe9b3 0%, #ffb347 55%, #ff7a1a 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 4px 24px rgba(255,120,0,0.35);
    letter-spacing:0.5px;
    margin-bottom:6px;
  }
  .game-tagline{
    font-size:14.5px;
    color:var(--text-dim);
    font-weight:500;
    margin-bottom:6px;
    letter-spacing:0.3px;
  }
  .support-line{
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:26px;
  }
  .support-line a{
    color:var(--gold);
    font-weight:600;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .support-line a:hover{color:#ffe066;}

  /* ---------- CTA ---------- */
  .cta-row{
    display:flex;
    gap:14px;
    margin-bottom:44px;
    width:100%;
    justify-content:center;
  }
  .cta-home{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    flex:1 1 0;
    max-width:220px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:17px;
    color:#3a0e00;
    background:linear-gradient(180deg, #ffe066 0%, #ffb020 55%, #ff7a00 100%);
    padding:16px 20px;
    border-radius:999px;
    text-decoration:none;
    box-shadow:0 8px 22px rgba(255,120,0,0.45), inset 0 1px 0 rgba(255,255,255,0.5);
    border:2px solid #ffd27f;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .cta-register{
    color:#fff3e6;
    background:linear-gradient(180deg, #3a2a24 0%, #24140e 100%);
    border:2px solid #ff8a3a;
    box-shadow:0 8px 22px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .cta-home:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 12px 28px rgba(255,120,0,0.55), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .cta-register:hover{
    box-shadow:0 12px 28px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .cta-home:active{transform:translateY(0) scale(0.98);}

  /* ---------- Community section ---------- */
  .section-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:22px;
    color:var(--gold);
    margin-bottom:4px;
  }
  .section-sub{
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:20px;
  }

  #server-list{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
  }
  .server-card{
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:16px;
    padding:16px 18px;
    backdrop-filter:blur(6px);
  }
  .server-name{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16.5px;
    color:#ffe6c2;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
    justify-content:center;
  }
  .server-name .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px 2px #ffcc4daa;
  }
  .zalo-row{
    display:flex;
    gap:10px;
  }
  .zalo-btn{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:linear-gradient(180deg, #1a8bff, var(--zalo));
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    padding:11px 10px;
    border-radius:12px;
    box-shadow:0 4px 12px rgba(0,104,255,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .zalo-btn:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,104,255,0.5);}
  .zalo-btn:active{transform:translateY(0) scale(0.97);}
  .zalo-btn svg{width:18px; height:18px; flex-shrink:0;}

  footer{
    position:relative;
    z-index:1;
    text-align:center;
    padding:24px 20px 34px;
    font-size:12px;
    color:#a3785433;
    color:#c99b6c99;
  }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:#241008;
    color:#ffe6c2;
    border:1px solid var(--card-border);
    padding:12px 20px;
    border-radius:999px;
    font-size:14px;
    font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:200;
    display:flex;
    align-items:center;
    gap:8px;
  }
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (max-width:380px){
    .zalo-row{flex-direction:column;}
    .cta-row{flex-direction:column; align-items:center;}
    .cta-home{padding:14px 28px; font-size:16.5px; max-width:280px; width:100%;}
  }
</style>
  </head>
  <body>

    <div class="particles" id="particles"></div>

    <div id="social-banner">
      <div class="banner-inner">
        <p>⚠️ Bạn đang mở bằng <strong>mạng xã hội</strong> nên sẽ
          <strong>không đăng ký / tải game</strong> được. Hãy copy
          link rồi mở bằng Chrome hoặc Safari nhé!</p>
        <button id="copy-link-btn">📋 Copy link</button>
      </div>
    </div>

    <main>
      <div class="logo-wrap">
        <div class="logo-glow"></div>
        <img class="logo-orb" src="images/avatar_tdstudio.png"
          alt="TDStudio">
      </div>

      <h1 class="game-name" id="game-name">Đang tải...</h1>
      <p class="game-tagline" id="game-tagline"></p>
      <p class="support-line">Liên hệ &amp; Hỗ trợ:
        <a href="https://thanhdistudio.com/support" target="_blank"
          rel="noopener">Click đây</a>
      </p>

      <div class="cta-row">
        <a class="cta-home cta-download" id="cta-download" href="#"
          target="_blank" rel="noopener">
          ⬇️ Tải Game
        </a>
        <a class="cta-home cta-register" id="cta-register" href="#"
          target="_blank" rel="noopener">
          📝 Đăng Ký
        </a>
      </div>

      <h2 class="section-title">Cộng Đồng Game Thủ</h2>
      <p class="section-sub">Tham gia nhóm Zalo theo server của bạn</p>

      <div id="server-list"></div>
    </main>

    <footer>© 2026 · Trang cộng đồng chính thức</footer>

    <div id="toast">✅ Đã copy link!</div>

    <script>
// ======================================================
// CONFIG — sửa các giá trị bên dưới cho đúng game của bạn
// ======================================================
const CONFIG = {
  gameName: "Ngọc Rồng TDStudio",
  tagline: "Game Nhập Vai HOT Năm 2026",
  downloadUrl: "https://sv7.thanhdi.games",
  registerUrl: "https://sv7.thanhdi.games/register",
  servers: [
    {
      name: "Server 1 - TDStudio Server 1",
      zalo1: "https://zalo.me/g/guxxky409",
      zalo2: "https://zalo.me/g/mftkmn654"
    },
    {
      name: "Server 2 - TDStudio Server 2",
      zalo1: "https://zalo.me/g/pqaiqm424",
      zalo2: "https://zalo.me/g/chhtoc951"
    },
    {
      name: "Server 3 - TDStudio Server 3",
      zalo1: "https://zalo.me/g/crnbag894",
      zalo2: "https://zalo.me/g/jcssww622"
    },
    {
      name: "Server 4 - TDStudio Server 4",
      zalo1: "https://zalo.me/g/gfnekq114",
      zalo2: "https://zalo.me/g/cxcyjr130"
    },
    {
      name: "Server 5 - TDStudio Server 5",
      zalo1: "https://zalo.me/g/uelhmv606",
      zalo2: "https://zalo.me/g/hfl2vzndgjskd0egmdmu"
    },
    {
      name: "Server 6 - TDStudio Server 6",
      zalo1: "https://zalo.me/g/bfoxoi238",
      zalo2: "https://zalo.me/g/cjqjbt811"
    },
    {
      name: "Server 7 - TDStudio Server 7",
      zalo1: "https://zalo.me/g/vxcuux196",
      zalo2: "https://zalo.me/g/esmrkv396"
    },
    {
      name: "Server Indo - TDStudio Server Indo",
      zalo1: "https://zalo.me/g/mftkmn654",
      zalo2: "https://zalo.me/g/chhtoc951"
    }
  ]
};
// ======================================================

const ZALO_ICON = `<svg viewBox="0 0 48 48" fill="currentColor"><path d="M24 4C12.95 4 4 12.06 4 22c0 5.6 2.87 10.6 7.36 13.9-.24 2-1 4.4-2.7 6.8-.2.28.06.66.4.58 3.9-.9 7-2.6 8.9-3.9 1.9.5 3.9.8 6 .8 11.05 0 20-8.06 20-18S35.05 4 24 4z"/></svg>`;

function render(){
  document.getElementById('game-name').textContent = CONFIG.gameName;
  document.getElementById('game-tagline').textContent = CONFIG.tagline;

  document.getElementById('cta-download').href = CONFIG.downloadUrl;
  document.getElementById('cta-register').href = CONFIG.registerUrl;

  const list = document.getElementById('server-list');
  list.innerHTML = CONFIG.servers.map(s => `
    <div class="server-card">
      <div class="server-name"><span class="dot"></span>${s.name}</div>
      <div class="zalo-row">
        <a class="zalo-btn" href="${s.zalo1}" target="_blank" rel="noopener">${ZALO_ICON} Nhóm Zalo 1</a>
        <a class="zalo-btn" href="${s.zalo2}" target="_blank" rel="noopener">${ZALO_ICON} Nhóm Zalo 2</a>
      </div>
    </div>
  `).join('');

  document.title = CONFIG.gameName + " - Cộng Đồng Game Thủ";
}

function spawnParticles(){
  const wrap = document.getElementById('particles');
  const count = window.innerWidth < 500 ? 14 : 24;
  for(let i=0;i<count;i++){
    const p = document.createElement('span');
    const left = (i / count) * 100 + (i % 3);
    const size = 3 + (i % 4) * 1.5;
    const duration = 6 + (i % 6) * 1.4;
    const delay = (i % 10) * 0.7;
    p.style.left = left + '%';
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = delay + 's';
    wrap.appendChild(p);
  }
}

// ---------- In-app browser detection ----------
function isInAppBrowser(){
  const ua = navigator.userAgent || navigator.vendor || window.opera || "";
  const patterns = [
    /FBAN|FBAV|FB_IAB|FBSV/i,      // Facebook / Messenger
    /Instagram/i,
    /Zalo/i,
    /Telegram/i,
    /Line\//i,
    /MicroMessenger/i,             // Zalo/WeChat webview
    /TikTok|BytedanceWebview/i,
    /Twitter/i,
    /wv\)/i                        // generic Android WebView marker
  ];
  return patterns.some(p => p.test(ua));
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
}

function copyCurrentLink(){
  const url = window.location.href;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url)
      .then(() => showToast('✅ Đã copy link! Mở Chrome/Safari và dán vào nhé'))
      .catch(() => fallbackCopy(url));
  } else {
    fallbackCopy(url);
  }
}

function fallbackCopy(url){
  const ta = document.createElement('textarea');
  ta.value = url;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{
    document.execCommand('copy');
    showToast('✅ Đã copy link! Mở Chrome/Safari và dán vào nhé');
  }catch(e){
    showToast('⚠️ Vui lòng tự copy link ở thanh địa chỉ');
  }
  document.body.removeChild(ta);
}

document.addEventListener('DOMContentLoaded', () => {
  render();
  spawnParticles();

  if(isInAppBrowser()){
    document.getElementById('social-banner').classList.add('show');
  }
  document.getElementById('copy-link-btn').addEventListener('click', copyCurrentLink);
});
</script>
  </body>
</html>
